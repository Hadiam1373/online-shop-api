version: '3.9'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres_prod
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: shopdb
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./prisma:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d shopdb']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - shop_network_prod
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Redis Cache (Production)
  redis:
    image: redis:7-alpine
    container_name: shop_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - shop_network_prod
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Node.js Express Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: shop_app_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-123456}@postgres:5432/shopdb
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecret_refresh_key}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SALT_ROUNDS: 12
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '5000:5000'
    restart: always
    networks:
      - shop_network_prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  shop_network_prod:
    driver: bridge